<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samrudhi Venture — Logo</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="samrudhi-icon.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; color: #17573F; background: #f6f8f7; padding: 2rem 1rem; }
    main { max-width: 960px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
    h2 { font-size: 1rem; margin: 2rem 0 0.75rem; color: #6E7B72; text-transform: uppercase; letter-spacing: 0.05em; }
    p.lead { color: #6E7B72; }
    .panel { border-radius: 14px; padding: 2rem; display: flex; justify-content: center; align-items: center; border: 1px solid #e3e8e5; }
    .panel img { max-width: 100%; height: auto; display: block; }
    .light { background: #fff; }
    .dark { background: #0f172a; }
    .dark .card { background: #fff; border-radius: 12px; padding: 0.25rem 0.75rem; }
    .icons { display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: flex-end; background: #fff; }
    .icons figure { text-align: center; font-size: 0.8rem; color: #6E7B72; }
    .icons img { display: block; margin: 0 auto 0.4rem; }
    .downloads a { color: #17573F; font-weight: 600; margin-right: 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>Samrudhi Venture — Logo</h1>
    <p class="lead">Growth • Opportunity • Progress</p>

    <h2>Primary logo (light background)</h2>
    <div class="panel light">
      <img src="samrudhi-venture-logo.svg" alt="Samrudhi Venture" width="560" height="240"
           onerror="this.onerror=null;this.src='samrudhi-venture-logo.png'" />
    </div>

    <h2>On dark background</h2>
    <div class="panel dark">
      <div class="card"><img src="samrudhi-venture-logo.png" alt="Samrudhi Venture" width="420" /></div>
    </div>

    <h2>Icon sizes</h2>
    <div class="panel icons">
      <figure><img src="icon-16.png" width="16" height="16" alt="" />16</figure>
      <figure><img src="icon-32.png" width="32" height="32" alt="" />32</figure>
      <figure><img src="icon-64.png" width="64" height="64" alt="" />64</figure>
      <figure><img src="icon-128.png" width="128" height="128" alt="" />128</figure>
      <figure><img src="icon-256.png" width="256" height="256" alt="" />256</figure>
    </div>

    <h2>Downloads</h2>
    <p class="downloads">
      <a href="samrudhi-venture-logo.svg" download>Logo SVG</a>
      <a href="samrudhi-venture-logo.png" download>Logo PNG</a>
      <a href="samrudhi-icon.svg" download>Icon SVG</a>
      <a href="icon-512.png" download>Icon 512 PNG</a>
      <a href="favicon.ico" download>favicon.ico</a>
    </p>
  </main>
</body>
</html>
